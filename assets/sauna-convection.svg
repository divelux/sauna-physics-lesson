<rect x="470" y="310" width="146" height="14"/><rect x="525" y="262" width="91" height="14"/><rect x="570" y="190" width="46" height="14" />
</g>
<g fill="none" stroke="#1c110b" stroke-width="2"><path d="M480 324V358M532 276V358M580 204V358"/></g>
<g fill="none" stroke="#f0762e" stroke-width="5" stroke-linecap="round" marker-end="url(#a)">
<path d="M100 240C100 170 100 100 110 60"/><path d="M140 48C280 40 430 40 560 52"/>
</g>
