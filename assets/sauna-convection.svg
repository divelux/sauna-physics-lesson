<text x="300" y="200">Cooler air sinks</text>
<text x="200" y="330">and flows back</text>
<text x="478" y="304" font-size="14">30 cm</text><text x="530" y="256" font-size="14">60 cm</text><text x="562" y="184" font-size="14">105 cm</text>
</g>
</svg>
