<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">A sauna seen from the side</title>
<desc id="d">A simplified drawing. A heater on the floor on the left, three benches stepping up on the right at 30, 60 and 105 centimeters. Arrows show warm air rising from the heater to the ceiling, moving across, and cooler air sinking near the far wall and flowing back along the floor.</desc>
