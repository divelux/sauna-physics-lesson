<rect x="20" y="20" width="600" height="340" fill="#fffdf9" stroke="#1c110b" stroke-width="4"/>
<g fill="#c99b6c" stroke="#1c110b" stroke-width="3">
<rect x="60" y="270" width="80" height="90"/>
